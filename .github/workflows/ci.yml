name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first: the only run that matters
# is the one for the current head.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, not "stable". A toolchain that moves on its own turns an unrelated
  # Flutter release into a failing build on a day nobody touched the code, and
  # on a clinical app the version that produced a release has to be recoverable.
  FLUTTER_VERSION: '3.47.7'

jobs:
  colour-engine:
    name: Colour engine (pure Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.5'

      - name: Resolve dependencies
        working-directory: packages/shade_core
        run: dart pub get

      - name: Verify formatting
        working-directory: packages/shade_core
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyse
        working-directory: packages/shade_core
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Test with coverage
        working-directory: packages/shade_core
        run: dart test --coverage=coverage --reporter=expanded

      # The colour engine is the part of this application that cannot be checked
      # by looking at the screen, so its coverage is a release gate rather than
      # a dashboard number.
      - name: Enforce coverage floor
        working-directory: packages/shade_core
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info \
            --report-on=lib --packages=.dart_tool/package_config.json
          covered=$(grep -c '^DA:.*,[1-9]' coverage/lcov.info || true)
          total=$(grep -c '^DA:' coverage/lcov.info || true)
          percent=$(( covered * 100 / total ))
          echo "line coverage: ${percent}% (${covered}/${total})"
          if [ "$percent" -lt 90 ]; then
            echo "::error::shade_core line coverage ${percent}% is below the 90% floor"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shade-core-coverage
          path: packages/shade_core/coverage/lcov.info

  generated-sources:
    name: Generated sources are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      # The ARB files are generated from tools/l10n/strings.py, which defines
      # both languages side by side. This step fails if someone edited an ARB
      # file by hand, which is how a key ends up in one language and not the
      # other.
      - name: Localisations match their source table
        run: python3 -I tools/l10n/generate.py --check

      # Pigeon output is committed so the native side can be read and built
      # without running codegen. That only helps if it is actually current.
      - name: Pigeon output matches the contract
        run: |
          dart run pigeon --input pigeons/shade_camera_api.dart
          if ! git diff --quiet -- \
            lib/data/platform/shade_camera_api.g.dart \
            ios/Runner/Camera/ShadeCameraApi.g.swift \
            android/app/src/main/kotlin/com/nuans/app/camera/ShadeCameraApi.g.kt; then
            echo "::error::Pigeon output is stale; run dart run pigeon and commit the result"
            git --no-pager diff --stat
            exit 1
          fi

      # The shipped shade libraries come out of a generator whose whole point is
      # that the values are a documented scaffold rather than recalled numbers.
      - name: Shade libraries match their generator
        run: |
          python3 -I tools/shade_libraries/generate.py
          if ! git diff --quiet -- assets/shade_libraries/; then
            echo "::error::the shipped shade libraries no longer match their generator"
            git --no-pager diff --stat
            exit 1
          fi

      - name: Specification oracle still agrees with the specification
        run: |
          python3 -I tools/spec_oracle/stage2_reference.py
          python3 -I tools/spec_oracle/fixtures.py > /dev/null

      # The iOS side is compiled in its own job, but only on macOS and only
      # when a runner is available. This check is cheap, runs anywhere, and
      # catches the failure a hand-written platform implementation actually
      # has: the contract moved and the implementation did not.
      - name: Hand-written native code matches the generated bindings
        run: |
          python3 -I tools/native/check_swift_against_pigeon.py
          python3 -I tools/native/check_kotlin_against_pigeon.py

      # The honest position on what a phone camera can measure is stated in the
      # specification, the onboarding and the result screen. Store copy is where
      # it is most tempting to quietly drop, so the constraint is enforced here
      # rather than left to whoever writes the listing.
      - name: Store copy states its limits
        run: python3 -I tools/store/check_copy.py

  app:
    name: Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      # Generated files are excluded, and have to be: they are committed
      # exactly as their generator emits them, so that the codegen freshness
      # checks in the other job can diff against the generator's own output.
      # Formatting them would make those two checks contradict each other -
      # which is precisely what happened, and failed both jobs. The analyzer
      # already excludes the same files, see analysis_options.yaml.
      - name: Verify formatting
        run: |
          git ls-files 'lib/*.dart' 'lib/**/*.dart' 'test/*.dart' 'test/**/*.dart' \
            | grep -v '[.]g[.]dart$' \
            | xargs dart format --output=none --set-exit-if-changed

      # The colour engine is a path dependency, so the root `flutter pub get`
      # resolves it as a dependency but leaves its own package config absent -
      # and a root-level analyse reads that package's tests, which then cannot
      # find package:test. Resolving it here is what makes the analysis of this
      # repository the same analysis a developer runs locally.
      - name: Resolve the colour engine's own dependencies
        working-directory: packages/shade_core
        run: dart pub get

      - name: Analyse
        run: flutter analyze --fatal-infos

      - name: Generate localisations
        run: flutter gen-l10n

      # A missing translation is written to this file rather than silently
      # falling back to English, because a half-translated clinical screen is
      # worse than an untranslated one: the reader cannot tell which half they
      # are looking at.
      - name: No untranslated messages
        run: |
          if [ -s build/l10n_untranslated.json ]; then
            echo "::error::untranslated messages remain"
            cat build/l10n_untranslated.json
            exit 1
          fi

      # Goldens are excluded here and run in their own job: see the comment
      # on that job.
      - name: Test
        run: flutter test --exclude-tags golden --reporter=expanded

  goldens:
    name: Golden images (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Generate localisations
        run: flutter gen-l10n

      # On macOS, because that is where the baselines were generated. Text
      # rasterisation and antialiasing differ between platforms, so the same
      # widget produces a different image on Linux and every comparison would
      # fail for a reason that has nothing to do with the code.
      #
      # The job earns its macOS runner on the other assertion in the harness:
      # it fails if any RenderFlex overflowed, in either language, at either
      # text scale. That is the failure these tests exist for - a badge that
      # fits in English and is clipped in Turkish - and it is how the recipe
      # card's header overflow was found.
      - name: Test
        run: flutter test --tags golden --reporter=expanded

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures
          path: test/**/failures/

  ios-build:
    name: iOS builds and native tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # The Swift capture layer is written and checked against the generated
      # Pigeon bindings, but the Xcode project that compiles it is not in the
      # repository yet. Rather than fail on every push, this job says so and
      # starts building the moment the project appears.
      - name: Is there an Xcode project to build?
        id: project
        run: |
          if [ -f ios/Runner.xcodeproj/project.pbxproj ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ios/Runner.xcodeproj yet, so the Swift capture layer is not compiled. The contract check in the generated-sources job is what covers it meanwhile. Run flutter create --platforms=ios . to add the project."
          fi

      - uses: subosito/flutter-action@v2
        if: steps.project.outputs.exists == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
        if: steps.project.outputs.exists == 'true'

      # No signing on a pull request: the build only has to prove the Swift
      # compiles against the generated Pigeon bindings, which is the check that
      # actually fails when the contract and the implementation drift apart.
      - name: Build without signing
        if: steps.project.outputs.exists == 'true'
        run: flutter build ios --release --no-codesign

      - name: Native unit tests
        if: steps.project.outputs.exists == 'true'
        run: |
          if xcodebuild -workspace ios/Runner.xcworkspace -list 2>/dev/null \
               | grep -q RunnerTests; then
            xcodebuild test \
              -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
              -only-testing:RunnerTests \
              CODE_SIGNING_ALLOWED=NO | xcpretty
          else
            echo "::notice::No RunnerTests scheme yet; nothing to run."
          fi

  android-build:
    name: Android builds and native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Build a debug bundle
        run: flutter build appbundle --debug

      - name: Native unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest
