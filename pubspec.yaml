name: nuans
description: >-
  Nuans measures a tooth's colour with a calibrated phone camera, matches it
  against standard shade guides and proposes a layering recipe.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.0
  intl: ^0.20.3
  meta: ^1.12.0
  pdf: ^3.11.0

  # The colour engine. Pure Dart, no Flutter, so it can be tested on its own.
  shade_core:
    path: packages/shade_core

# Declared but not yet imported, so deliberately NOT dependencies: every one of
# these pulls native Android and iOS code into the build, and a dependency that
# nothing imports is build risk bought with no feature. Each goes back in with
# the code that uses it.
#
#   drift, sqlite3_flutter_libs       encrypted local database
#   sqlcipher_flutter_libs            ^ note: the 0.6 line is discontinued and
#                                       0.7 is published as "+eol", so the
#                                       encryption layer needs a decision
#                                       before it is built on
#   flutter_secure_storage            the SQLCipher key in Keychain/Keystore
#   path, path_provider               where the database and images live
#   printing, share_plus              sending the report to a laboratory
#   sensors_plus                      the tilt indicator on the camera screen
#   uuid                              capture identifiers, minted in Dart
#   riverpod_annotation               code generation for the providers

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: ^22.0.0
  very_good_analysis: ^6.0.0

# Parked with their runtime counterparts:
#   build_runner, drift_dev, riverpod_generator   code generation
#   golden_toolkit                                 the golden harness in
#                                                  test/golden/ uses only
#                                                  flutter_test today

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/shade_libraries/
    - assets/rules/
    - assets/reference/

  fonts:
    # The pdf package's built-in fonts cannot render ç, ğ, ı, İ, ö, ş or ü, so a
    # Turkish report built with them comes out with holes in it. Noto Sans is
    # embedded in the document itself rather than relied on at the reader's end.
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
