distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# The -bin distribution, not -all: -all bundles the Gradle sources and
# documentation, which a build never reads, and on a cold cache that is a
# quarter of a gigabyte before the first line of Kotlin is compiled.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
